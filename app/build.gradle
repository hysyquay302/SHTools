plugins {
    id 'com.android.application'
}
Properties properties = new Properties()

File localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        properties.load(reader)
    }
}
android {
    compileSdk 35

    defaultConfig {
        applicationId "com.quayquay.shtools"
        minSdkVersion 28
        targetSdkVersion 33

        versionCode rootProject.ext.myVersionCode
        versionName rootProject.ext.myVersionName
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        buildConfigField "int", "TOOL_VERSION_CODE", "${rootProject.ext.myVersionCode}"
        buildConfigField "String", "TOOL_VERSION_NAME", "\"${rootProject.ext.myVersionName}\""
        resValue "string", "app_version_text", "\"Version ${myVersionName}\""
        buildConfigField "String", "API_KEY_GEMINI_KEY", "\"${properties.getProperty('API_KEY_GEMINI_KEY')}\""
        buildConfigField "String", "API_SERVEY", "\"${properties.getProperty('API_SERVEY')}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

    }
    buildFeatures {
        aidl true
        buildConfig true // Đặt true để cho phép sử dụng AIDL
    }
    packagingOptions {
        exclude 'META-INF/androidx.activity_activity.version'
        exclude 'META-INF/DEPENDENCIES'
    }
    namespace 'com.quayquay.shtools'
}

dependencies {
    implementation 'androidx.media3:media3-common:1.9.3'

    // Thư viện giao diện chính (đã bao gồm appcompat-resources, activity, lifecycle, annotation)
    def appcompat_version = "1.7.1"
    implementation "androidx.appcompat:appcompat:$appcompat_version"
    implementation 'com.google.android.material:material:1.13.0'

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.work:work-runtime:2.11.2'
    testImplementation 'junit:junit:4.13.2'

    implementation 'org.apache.commons:commons-io:1.3.2'
    implementation 'com.warrenstrange:googleauth:1.5.0'
    implementation 'com.github.bumptech.glide:glide:5.0.7'
    implementation 'org.bitbucket.cowwoc:diff-match-patch:1.2'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.ibm.icu:icu4j:78.3'

    // Thư viện riêng của bạn
    implementation 'com.github.hysyquay302:hsq:1.6.9'

}