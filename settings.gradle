dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()

        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/hysyquay302/HSQLibrary")
            credentials {
                // --- SỬA LẠI CHỖ NÀY ---
                // Truy cập trực tiếp vào thuộc tính, không cần settings. hay project.
                username = GPR_USER
                password = GPR_TOKEN
            }
        }
    }
}
include ':app'
rootProject.name = "SHTools"
// Khi co local HSQLibrary canh SHTools, build APK truc tiep voi source moi nhat thay vi dung cache GitHub Packages.
def localHsqLibrary = file('../HSQLibrary')
if (localHsqLibrary.exists()) {
    includeBuild(localHsqLibrary) {
        dependencySubstitution {
            substitute module('com.github.hysyquay302:hsq') using project(':HSQ')
        }
    }
}
include ':OcrLibrary'
